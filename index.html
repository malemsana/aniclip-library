<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Clips Library - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: { 900: '#0f172a', 950: '#020617' },
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    },
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out forwards' }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            background-image: radial-gradient(circle at 50% -20%, #172554 0%, transparent 40%);
            background-attachment: fixed;
            color: #f1f5f9;
        }
        
        /* Custom Utilities */
        .text-glow { text-shadow: 0 0 20px rgba(59,130,246,0.5); }
        
        .search-input-wrapper:focus-within {
            box-shadow: 0 0 20px -5px rgba(59,130,246,0.5);
            border-color: rgba(59,130,246,0.6);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card-enter { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        
        .material-symbols-rounded { font-size: 24px; vertical-align: middle; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- ==== HEADER ==== -->
    <header class="sticky top-0 z-40 border-b border-white/10 bg-slate-950/70 backdrop-blur-xl supports-[backdrop-filter]:bg-slate-950/50">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            
            <!-- LOGO -->
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold group">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center group-hover:scale-105 transition-transform duration-300">
                    <span class="material-symbols-rounded text-white text-sm">movie</span>
                </div>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                    Anime<span class="text-blue-500">Clips</span>
                </span>
            </a>

            <!-- Nav Links -->
            <div class="flex gap-6">
                <a href="#" class="text-sm font-medium text-white border-b-2 border-blue-500 py-5">
                    Home
                </a>
            </div>
        </nav>
    </header>

    <!-- ==== MAIN CONTENT ==== -->
    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-12">

        <!-- Hero Section -->
        <section class="text-center mb-12 relative">
            <!-- Ambient Glow Behind Hero -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-blue-600/20 blur-[100px] -z-10 rounded-full pointer-events-none"></div>

            <h1 class="text-4xl sm:text-6xl font-black text-white mb-4 tracking-tight text-glow leading-tight">
                The Ultimate <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">Editing Resource</span>
            </h1>
            <p class="text-lg text-slate-400 mb-8 max-w-2xl mx-auto leading-relaxed">
                High-quality raw clips, 1080p resolution. <br>Designed for AMV editors and content creators.
            </p>
            
            <!-- Modern Search Bar -->
            <div class="max-w-xl mx-auto relative z-20 group">
                <div class="search-input-wrapper relative flex items-center bg-slate-900/80 backdrop-blur-md border border-white/10 rounded-full p-2 transition-all duration-300">
                    <span class="material-symbols-rounded text-slate-500 ml-4">search</span>
                    <input 
                        type="search" 
                        id="search-input"
                        onkeyup="handleSearch()"
                        placeholder="Search anime (e.g., 'Hyouka', 'Jujutsu Kaisen')" 
                        class="w-full bg-transparent text-white placeholder-slate-500 px-4 py-3 outline-none text-lg"
                    >
                    <div class="hidden sm:flex items-center pr-2">
                        <span class="text-xs text-slate-600 border border-slate-700 rounded px-2 py-1 font-mono">CTRL+K</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Anime Grid Section -->
        <section>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="material-symbols-rounded text-blue-500">trending_up</span>
                    Trending Now
                </h2>
            </div>
            
            <!-- MODIFIED GRID: Reduced gap, closer elements -->
            <div id="anime-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-1.5 sm:gap-2">
                <!-- Cards injected via JS -->
            </div>
            
            <div id="no-results" class="hidden text-center py-20">
                <p class="text-slate-400 text-lg">No anime found. Try a different keyword.</p>
            </div>
        </section>

    </main>

    <!-- ==== FOOTER ==== -->
    <footer class="border-t border-white/5 bg-slate-950/30 mt-auto">
        <div class="container mx-auto px-4 py-12">
            <div class="flex flex-col items-center text-center">
                <p class="text-slate-500 text-sm">&copy; 2025 Anime Clips Library.</p>
            </div>
        </div>
    </footer>

    <!-- ========================= JS ========================= -->
    <script>
        // Mock Data
        const libraryData = [
            {
                title: 'Hyouka',
                poster: 'https://th.bing.com/th/id/R.50d2437221c41665f5e49af7eb39da9b?rik=DeKj9eAWd3%2fMwg&riu=http%3a%2f%2fwww.anime-evo.net%2fwp-content%2fuploads%2f2012%2f09%2f13.jpg&ehk=yP9MpbHOg%2bC5lQKiZSknVeSU2tN3BxLawgYi6muIzqQ%3d&risl=&pid=ImgRaw&r=0',
                clips: 30,
                tags: ['Slice of Life', 'Mystery']
            },
            {
                title: 'Jujutsu Kaisen',
                poster: 'https://www.comingsoon.net/wp-content/uploads/sites/3/2023/09/Jujutsu-Kaisen-Chapter-236-Release-Date.jpg',
                clips: 45,
                tags: ['Action', 'Supernatural']
            },
            {
                title: 'Attack on Titan',
                poster: 'https://th.bing.com/th/id/R.1aa6aef70d6fa47d0e3cbc366313d074?rik=Pi5pMtvBFDX%2bdw&riu=http%3a%2f%2fctrlgeekgirl.files.wordpress.com%2f2013%2f11%2fattackontitan-1.jpg&ehk=blVHthF5d6rE8lJCM1Kh%2bgG5ZbAoddey1TNMWPW2%2fIo%3d&risl=&pid=ImgRaw&r=0',
                clips: 112,
                tags: ['Dark', 'War']
            },
            {
                title: 'Demon Slayer',
                poster: 'https://tse1.mm.bing.net/th/id/OIP.HEPFkoMS4vdddBpx6tLJ-wHaEK?rs=1&pid=ImgDetMain&o=7&rm=3',
                clips: 89,
                tags: ['Historical', 'Fantasy']
            },
            {
                title: 'Spy x Family',
                poster: 'https://img1.ak.crunchyroll.com/i/spire3/11b38d26e15859569eaa2b57d608edc81656560061_main.jpg',
                clips: 25,
                tags: ['Comedy', 'Espionage']
            },
            {
                title: 'Chainsaw Man',
                poster: 'https://images3.alphacoders.com/128/thumb-1920-1287354.png',
                clips: 15,
                tags: ['Gore', 'Dark Fantasy']
            }
        ];

        const gridEl = document.getElementById('anime-grid');
        const searchInput = document.getElementById('search-input');
        const noResults = document.getElementById('no-results');

        function renderCards(data) {
            gridEl.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach((anime, index) => {
                const delay = index * 50; 
                const encodedName = encodeURIComponent(anime.title);
                
                gridEl.innerHTML += `
                    <div class="card-enter" style="animation-delay: ${delay}ms">
                        <!-- MODIFIED CARD: Square corners, no lift, subtle zoom -->
                        <a href="anime.html?name=${encodedName}" class="group relative block w-full aspect-4-3 overflow-hidden bg-slate-800 hover:z-10">
                            
                            <!-- Image: Zoom changed from scale-110 to scale-105 -->
                            <img src="${anime.poster}" alt="${anime.title}" 
                                 class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105 group-hover:brightness-110">
                            
                            <!-- Gradient Overlay -->
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent opacity-60 group-hover:opacity-40 transition-opacity"></div>
                            
                            <!-- Content (Bottom) -->
                            <div class="absolute bottom-0 left-0 w-full p-4 z-20">
                                <!-- Tags -->
                                <div class="flex gap-1 mb-1 opacity-90 flex-wrap">
                                    <span class="text-[9px] font-bold text-blue-300 uppercase tracking-wider bg-blue-900/40 px-1.5 py-0.5">
                                        ${anime.tags[0]}
                                    </span>
                                    ${anime.tags[1] ? `<span class="text-[9px] text-slate-300 bg-black/40 px-1.5 py-0.5 uppercase tracking-wider">${anime.tags[1]}</span>` : ''}
                                </div>
                                
                                <!-- Title -->
                                <h3 class="text-xl font-black text-white leading-tight drop-shadow-md group-hover:text-blue-400 transition-colors">
                                    ${anime.title}
                                </h3>
                            </div>
                            
                            <!-- Top Right Badge (Clip count) -->
                            <div class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white text-[10px] font-mono px-2 py-0.5">
                                ${anime.clips} Clips
                            </div>
                        </a>
                    </div>
                `;
            });
        }

        function handleSearch() {
            const query = searchInput.value.toLowerCase();
            const filtered = libraryData.filter(anime => 
                anime.title.toLowerCase().includes(query)
            );
            renderCards(filtered);
        }
        
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        window.onload = () => renderCards(libraryData);

    </script>
</body>
</html>
