<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Anime | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gray: { 900: '#0f172a', 950: '#020617' } },
                    animation: { 'slide-in': 'slideIn 0.3s ease-out forwards', 'slide-out': 'slideOut 0.3s ease-in forwards' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .material-symbols-rounded { font-size: 20px; vertical-align: middle; }
        
        /* Dark Inputs & Zones */
        .input-dark, select.input-dark {
            background-color: #1e293b !important; border-color: #334155 !important; color: #f8fafc !important;
            width: 100%; border-radius: 0.5rem; padding: 0.6rem 1rem; font-size: 0.875rem; outline: none; transition: all 0.2s;
        }
        .input-dark:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .label-dark { display: block; font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        
        .upload-zone { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%23334155FF' stroke-width='2' stroke-dasharray='8%2c8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); }
        .upload-zone:hover { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%233B82F6FF' stroke-width='2' stroke-dasharray='8%2c8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); background-color: rgba(59, 130, 246, 0.05); }
        #drawer-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 relative">

    <!-- ==== NAVBAR ==== -->
    <nav class="sticky top-0 z-40 border-b border-white/5 bg-slate-950/90 backdrop-blur-md">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="admin-index.html" class="text-slate-400 hover:text-white flex items-center gap-1 text-sm font-bold transition-colors">
                    <span class="material-symbols-rounded">arrow_back</span>
                    <span class="hidden sm:inline">Back</span>
                </a>
                <div class="h-4 w-[1px] bg-slate-700"></div>
                <span class="text-white font-bold text-lg flex items-center gap-2">
                    <span class="material-symbols-rounded text-slate-500">edit_square</span> Edit Series
                </span>
            </div>
            <button onclick="saveChanges()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold text-sm transition-all shadow-lg shadow-blue-600/20 flex items-center gap-2 group">
                <span class="material-symbols-rounded group-hover:scale-110 transition-transform">save</span>
                <span>Save Changes</span>
            </button>
        </div>
    </nav>

    <!-- ==== MAIN CONTENT ==== -->
    <main class="container mx-auto px-4 py-8 max-w-5xl">

        <!-- 1. ANIME METADATA -->
        <div class="bg-slate-900 border border-white/5 rounded-xl p-6 mb-8 shadow-xl">
            <h2 class="text-base font-bold text-white mb-6 border-b border-white/5 pb-4 flex items-center gap-2">
                <span class="material-symbols-rounded text-blue-500 bg-blue-500/10 p-1 rounded">settings</span> 
                Series Metadata
            </h2>
            <div class="flex flex-col sm:flex-row gap-6">
                <!-- Poster Upload -->
                <div class="shrink-0">
                    <label class="label-dark mb-2">Thumbnail (4:3)</label>
                    <input type="file" id="poster-upload" accept="image/*" class="hidden" onchange="previewImage(event, 'poster-preview')">
                    <div class="relative group w-48 aspect-[4/3] rounded-lg overflow-hidden cursor-pointer transition-all" onclick="document.getElementById('poster-upload').click()">
                        <div class="upload-zone absolute inset-0 bg-slate-950 transition-all flex flex-col items-center justify-center text-slate-500 group-hover:text-blue-400">
                            <span class="material-symbols-rounded text-3xl mb-1">add_photo_alternate</span>
                            <span class="text-[10px] font-bold uppercase">Upload Image</span>
                        </div>
                        <img id="poster-preview" src="" class="relative w-full h-full object-cover hidden z-10">
                        <div class="absolute inset-0 bg-black/60 z-20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"><span class="text-white text-xs font-bold flex items-center gap-1"><span class="material-symbols-rounded text-sm">edit</span> Change</span></div>
                    </div>
                </div>
                <!-- Fields -->
                <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4 content-start">
                    <div class="col-span-1 sm:col-span-2"><label class="label-dark">Series Title</label><input type="text" id="anime-title" placeholder="e.g. Hyouka" class="input-dark"></div>
                    <div>
                        <label class="label-dark">Tags</label>
                        <div class="relative">
                            <input type="text" placeholder="Add tag..." class="input-dark pl-9" id="tags-input">
                            <span class="material-symbols-rounded absolute left-2.5 top-2 text-slate-500 text-sm">label</span>
                        </div>
                        <div id="tags-preview" class="flex gap-2 mt-3 flex-wrap min-h-[1.5rem]"></div>
                    </div>
                    <div><label class="label-dark">Status</label><select class="input-dark"><option value="published">Published</option><option value="draft">Draft</option></select></div>
                </div>
            </div>
        </div>

        <!-- 2. CONTENT MANAGER BAR -->
        <div class="flex justify-between items-end mb-4">
            <div><h3 class="text-lg font-bold text-white flex items-center gap-2"><span class="material-symbols-rounded text-emerald-400">movie_filter</span> Content Manager</h3><p class="text-xs text-slate-500 mt-1">Manage episodes hierarchy and video files.</p></div>
            <div class="flex gap-3">
                <button class="bg-slate-800 text-slate-300 border border-slate-700 hover:border-white/20 hover:text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors shadow-sm">
                    <span class="material-symbols-rounded text-lg">data_object</span> Import JSON
                </button>
                <button onclick="addEpisode()" class="bg-blue-600/10 text-blue-400 border border-blue-600/20 hover:bg-blue-600/20 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors shadow-sm">
                    <span class="material-symbols-rounded text-lg">playlist_add</span> Add Episode
                </button>
            </div>
        </div>

        <div id="episodes-container" class="space-y-6">
            <!-- Episodes injected by JS -->
        </div>
    </main>

    <!-- ==== SLIDE-OUT DRAWER ==== -->
    <div id="drawer-overlay" class="fixed inset-0 z-40 hidden transition-opacity opacity-0" onclick="closeEditor()"></div>
    <aside id="clip-editor-drawer" class="fixed top-0 right-0 w-[400px] max-w-[90%] h-full bg-slate-950 border-l border-white/5 shadow-2xl z-50 translate-x-full transition-transform duration-300 ease-out flex flex-col">
        <!-- Header -->
        <div class="h-16 px-6 border-b border-white/5 flex justify-between items-center bg-slate-900/50">
            <h2 class="text-white font-bold flex items-center gap-2"><span class="material-symbols-rounded text-blue-500">tune</span> Edit Details</h2>
            <button onclick="closeEditor()" class="text-slate-500 hover:text-white transition-colors"><span class="material-symbols-rounded text-2xl">close</span></button>
        </div>
        <!-- Body -->
        <div class="flex-grow overflow-y-auto p-6 space-y-6">
            <input type="hidden" id="edit-clip-id"><input type="hidden" id="edit-ep-id">
            
            <div>
                <label class="label-dark mb-2">Clip Thumbnail</label>
                <div class="relative group w-full aspect-16-9 bg-black rounded-lg overflow-hidden border border-slate-800 cursor-pointer" onclick="document.getElementById('edit-thumb-upload').click()">
                    <img id="edit-preview-img" src="" class="w-full h-full object-cover opacity-70">
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-white/50 group-hover:bg-black/50 group-hover:text-white transition-all">
                        <span class="material-symbols-rounded text-3xl mb-1">image_update</span>
                    </div>
                </div>
                <input type="file" id="edit-thumb-upload" class="hidden" accept="image/*" onchange="previewImage(event, 'edit-preview-img')">
            </div>

            <div class="space-y-4">
                <div><label class="label-dark">Filename</label><input type="text" id="edit-filename" class="input-dark font-mono"></div>
                <div><label class="label-dark">Direct Video URL</label>
                    <div class="relative"><input type="text" id="edit-url" class="input-dark font-mono text-xs pr-10"><span class="material-symbols-rounded absolute right-2.5 top-2 text-slate-500 text-sm">link</span></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="label-dark">Quality</label><select id="edit-quality" class="input-dark"><option value="">--</option><option value="4K">4K</option><option value="1080p">1080p</option></select></div>
                    <div><label class="label-dark">Duration</label><input type="text" id="edit-duration" placeholder="0:00" class="input-dark text-center"></div>
                </div>
                <div><label class="label-dark">Date Added</label><input type="date" id="edit-date" class="input-dark text-slate-400"></div>
            </div>
        </div>
        <!-- Footer -->
        <div class="p-4 border-t border-white/5 bg-slate-900/50 flex gap-3 items-center">
            <button onclick="deleteCurrentClip()" class="p-2 bg-red-500/10 text-red-500 hover:bg-red-600 hover:text-white rounded-lg transition-colors flex items-center justify-center mr-auto"><span class="material-symbols-rounded text-lg">delete_forever</span></button>
            <button onclick="closeEditor()" class="px-4 py-2 text-slate-400 hover:text-white font-medium text-sm flex items-center gap-1"><span class="material-symbols-rounded text-base">close</span> Cancel</button>
            <button onclick="saveClipEditor()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold text-sm transition-colors shadow-lg flex items-center gap-2"><span class="material-symbols-rounded text-base">check_circle</span> Save</button>
        </div>
    </aside>

    <!-- ==== JS LOGIC ==== -->
    <script>
        let animeData = { episodes: [{ id: 1, title: "The Revival of the Traditional Classic Lit Club", clips: [{ id: 101, name: "hyouka_S01_E01_C0028", quality: "1080p", url: "https://vidplay.io/...", thumb: "https://i.ibb.co/rfZzBS6c/142899078d7c.jpg" }] }] };

        const episodesContainer = document.getElementById('episodes-container');
        const drawer = document.getElementById('clip-editor-drawer');
        const backdrop = document.getElementById('drawer-overlay');
        let currentEditingRow = null;

        window.onload = () => renderAllEpisodes();

        function renderAllEpisodes() {
            episodesContainer.innerHTML = '';
            animeData.episodes.forEach(ep => createEpisodeCard(ep));
        }

        function createEpisodeCard(epData) {
            const epId = epData.id;
            const cardHtml = `
                <div class="bg-slate-900 border border-white/5 rounded-xl overflow-hidden shadow-sm hover:border-white/10 transition-colors group" id="episode-${epId}">
                    <!-- Card Header -->
                    <div class="bg-slate-950/50 px-5 py-3 border-b border-white/5 flex items-center gap-4 cursor-pointer hover:bg-white/5 transition-colors" onclick="toggleAccordion('${epId}')">
                        <span class="bg-slate-800 text-slate-400 text-[10px] font-bold px-2 py-1 rounded border border-slate-700 flex items-center gap-1"><span class="material-symbols-rounded text-sm">folder</span> EP</span>
                        <input type="text" value="${epData.title}" class="bg-transparent border-none text-white font-medium focus:ring-0 w-full p-0 text-sm placeholder-slate-600" onclick="event.stopPropagation()">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-rounded text-slate-500 text-lg transition-transform rotate-180" id="chevron-${epId}">expand_more</span>
                            <button class="text-slate-600 hover:text-red-500 flex items-center justify-center p-1 rounded" onclick="deleteEp('${epId}'); event.stopPropagation()"><span class="material-symbols-rounded text-lg">delete</span></button>
                        </div>
                    </div>
                    <!-- Card Content -->
                    <div class="p-5" id="content-${epId}">
                        <div class="border border-slate-800 rounded-lg overflow-hidden bg-slate-950">
                            <table class="w-full text-left text-xs text-slate-400">
                                <thead class="uppercase font-bold text-[10px] text-slate-500 bg-slate-900 border-b border-slate-800">
                                    <tr>
                                        <th class="px-4 py-2 w-12 text-center"><span class="material-symbols-rounded text-base">image</span></th>
                                        <th class="px-4 py-2">Filename</th>
                                        <th class="px-4 py-2 w-24">Quality</th>
                                        <th class="px-4 py-2">Stream URL</th>
                                        <th class="px-2 py-2 w-10"></th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/50" id="clip-list-${epId}">
                                    ${epData.clips.map(c => getClipRowHtml(c, epId)).join('')}
                                </tbody>
                            </table>
                        </div>
                        <!-- Quick Add Bar -->
                        <div class="mt-3 flex items-center gap-2">
                             <div class="relative flex-grow">
                                <span class="material-symbols-rounded absolute left-2.5 top-1.5 text-slate-600 text-lg">add_link</span>
                                <input type="text" placeholder="Paste video URL..." class="input-dark pl-9 !py-1.5 bg-slate-950">
                             </div>
                             <button class="bg-slate-800 hover:bg-blue-600 hover:text-white text-slate-300 border border-slate-700 hover:border-blue-500 px-4 py-1.5 rounded text-xs font-bold transition-all flex items-center gap-1 shadow-sm">
                                <span class="material-symbols-rounded text-base">add</span> Add
                             </button>
                        </div>
                    </div>
                </div>
            `;
            episodesContainer.insertAdjacentHTML('beforeend', cardHtml);
        }

        function getClipRowHtml(clip, epId) {
            const clipJson = encodeURIComponent(JSON.stringify(clip));
            return `
                <tr class="hover:bg-blue-900/10 transition-colors cursor-pointer group" onclick="openEditor(this, '${epId}', '${clipJson}')" id="clip-row-${clip.id}">
                    <td class="px-4 py-2">
                        <div class="w-8 h-8 rounded bg-black border border-slate-800 relative overflow-hidden group-hover:border-blue-500/30 transition-colors">
                             <img src="${clip.thumb}" class="w-full h-full object-cover clip-thumb-img">
                        </div>
                    </td>
                    <td class="px-4 py-2 font-mono text-slate-300 clip-name-text flex items-center gap-2">${clip.name}</td>
                    <td class="px-4 py-2"><span class="bg-blue-500/10 text-blue-400 px-1.5 py-0.5 rounded text-[9px] border border-blue-500/20 uppercase font-bold clip-qual-text">${clip.quality}</span></td>
                    <td class="px-4 py-2 text-[10px] opacity-50 clip-url-text truncate max-w-[150px] font-mono">${clip.url}</td>
                    <td class="px-2 py-2 text-right"><span class="material-symbols-rounded text-base opacity-0 group-hover:opacity-100 text-blue-400">edit_square</span></td>
                </tr>
            `;
        }

        // 3. DRAWER & UPLOAD
        function previewImage(event, id) {
            const reader = new FileReader();
            reader.onload = () => { document.getElementById(id).src = reader.result; document.getElementById(id).classList.remove('hidden'); }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }
        
        function openEditor(row, epId, json) {
            const clip = JSON.parse(decodeURIComponent(json));
            currentEditingRow = row;
            document.getElementById('edit-filename').value = clip.name;
            document.getElementById('edit-preview-img').src = clip.thumb;
            document.getElementById('edit-quality').value = clip.quality;
            // ... map other fields
            drawer.classList.remove('translate-x-full');
            backdrop.classList.remove('hidden'); backdrop.classList.add('opacity-100');
        }

        function closeEditor() {
            drawer.classList.add('translate-x-full');
            backdrop.classList.remove('opacity-100'); setTimeout(() => backdrop.classList.add('hidden'), 300);
        }
        
        // Actions
        function toggleAccordion(id) { document.getElementById(`content-${id}`).classList.toggle('hidden'); document.getElementById(`chevron-${id}`).classList.toggle('rotate-180'); }
        function addEpisode() { createEpisodeCard({ id: Date.now(), title: "", clips: [] }); }
        function saveChanges() { const b = document.querySelector('button[onclick="saveChanges()"]'); b.innerHTML=`<span class="material-symbols-rounded animate-spin">sync</span> Saving`; setTimeout(() => b.innerHTML=`<span class="material-symbols-rounded">save</span> Save`, 1000); }
        function saveClipEditor() { closeEditor(); /* Mock save logic here */ }
        function deleteCurrentClip() { if(currentEditingRow) currentEditingRow.remove(); closeEditor(); }
        function deleteEp(id) { document.getElementById(`episode-${id}`).remove(); }
    </script>
</body>
</html>
