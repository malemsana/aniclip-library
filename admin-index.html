<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AnimeClips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: { 900: '#0f172a', 950: '#020617' },
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .material-symbols-rounded { font-size: 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-b from-gray-950 to-slate-950">

    <!-- ==== ADMIN NAVBAR ==== -->
    <nav class="sticky top-0 z-50 border-b border-white/5 bg-slate-950/80 backdrop-blur-md">
        <div class="container mx-auto px-6 h-16 flex justify-between items-center">
            <!-- Brand -->
            <div class="flex items-center gap-2 font-bold text-lg">
                <div class="w-7 h-7 bg-blue-600 rounded flex items-center justify-center text-white">
                    <span class="material-symbols-rounded" style="font-size: 18px;">admin_panel_settings</span>
                </div>
                <span class="text-slate-200">AnimeClips <span class="text-slate-600 font-normal text-sm ml-1">| Panel</span></span>
            </div>

            <!-- User/Logout -->
            <div class="flex items-center gap-4">
                <button class="text-slate-400 hover:text-white text-sm font-medium">Settings</button>
                <button class="bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded text-xs font-bold uppercase tracking-wide transition-all">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- ==== MAIN CONTENT ==== -->
    <main class="container mx-auto px-6 py-10 flex-grow">

        <!-- 1. DASHBOARD STATS -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
            <!-- Card 1 -->
            <div class="bg-slate-900 border border-white/5 p-5 rounded-xl shadow-lg">
                <p class="text-slate-500 text-xs uppercase font-bold tracking-wider mb-1">Total Series</p>
                <div class="flex items-center justify-between">
                    <span class="text-3xl font-black text-white">124</span>
                    <span class="material-symbols-rounded text-blue-500 bg-blue-500/10 p-2 rounded-lg">movie_filter</span>
                </div>
            </div>
            <!-- Card 2 -->
            <div class="bg-slate-900 border border-white/5 p-5 rounded-xl shadow-lg">
                <p class="text-slate-500 text-xs uppercase font-bold tracking-wider mb-1">Total Clips</p>
                <div class="flex items-center justify-between">
                    <span class="text-3xl font-black text-white">8,291</span>
                    <span class="material-symbols-rounded text-emerald-500 bg-emerald-500/10 p-2 rounded-lg">cut</span>
                </div>
            </div>
            <!-- Card 3 -->
            <div class="bg-slate-900 border border-white/5 p-5 rounded-xl shadow-lg">
                <p class="text-slate-500 text-xs uppercase font-bold tracking-wider mb-1">Storage Used</p>
                <div class="flex items-center justify-between">
                    <span class="text-3xl font-black text-white">142 <span class="text-lg font-normal text-slate-500">GB</span></span>
                    <span class="material-symbols-rounded text-purple-500 bg-purple-500/10 p-2 rounded-lg">cloud</span>
                </div>
            </div>
            <!-- Card 4 -->
            <div class="bg-slate-900 border border-white/5 p-5 rounded-xl shadow-lg">
                <p class="text-slate-500 text-xs uppercase font-bold tracking-wider mb-1">Bandwidth (7d)</p>
                <div class="flex items-center justify-between">
                    <span class="text-3xl font-black text-white">4.2 <span class="text-lg font-normal text-slate-500">TB</span></span>
                    <span class="material-symbols-rounded text-orange-500 bg-orange-500/10 p-2 rounded-lg">ssid_chart</span>
                </div>
            </div>
        </div>

        <!-- 2. LIBRARY MANAGEMENT HEADER -->
        <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Library Management</h1>
                <p class="text-slate-500 text-sm">Manage your anime series and clips.</p>
            </div>
            
            <div class="flex gap-3 w-full sm:w-auto">
                <!-- Search -->
                <div class="relative flex-grow sm:flex-grow-0">
                    <span class="material-symbols-rounded absolute left-3 top-2.5 text-slate-500">search</span>
                    <input type="text" id="admin-search" onkeyup="handleAdminSearch()" placeholder="Search series..." class="w-full sm:w-64 bg-slate-900 border border-slate-700 text-slate-200 pl-10 pr-4 py-2 rounded-lg focus:outline-none focus:border-blue-500 transition-colors text-sm">
                </div>
                <!-- Add Button -->
                <a href="admin-edit.html" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-semibold text-sm transition-colors shadow-lg shadow-blue-600/20 whitespace-nowrap">
                    <span class="material-symbols-rounded text-lg">add</span>
                    Add New Anime
                </a>
            </div>
        </div>

        <!-- 3. DATA LIST -->
        <div class="bg-slate-900 border border-white/5 rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-slate-400">
                    <thead class="bg-slate-950 text-xs uppercase font-bold text-slate-500 border-b border-white/5">
                        <tr>
                            <th class="px-6 py-4 w-20">#</th>
                            <th class="px-6 py-4">Anime Series</th>
                            <th class="px-6 py-4">Stats</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Updated</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-white/5" id="admin-table-body">
                        <!-- Row Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script to populate mock data -->
    <script>
        const animeList = [
            { id: 101, title: 'Hyouka', episodes: 2, clips: 30, status: 'Published', date: '2023-10-24', img: 'https://th.bing.com/th/id/R.50d2437221c41665f5e49af7eb39da9b?rik=DeKj9eAWd3%2fMwg&riu=http%3a%2f%2fwww.anime-evo.net%2fwp-content%2fuploads%2f2012%2f09%2f13.jpg&ehk=yP9MpbHOg%2bC5lQKiZSknVeSU2tN3BxLawgYi6muIzqQ%3d&risl=&pid=ImgRaw&r=0' },
            { id: 102, title: 'Jujutsu Kaisen', episodes: 24, clips: 45, status: 'Published', date: '2023-10-22', img: 'https://images7.alphacoders.com/112/1126262.jpg' },
            { id: 103, title: 'Attack on Titan', episodes: 89, clips: 112, status: 'Published', date: '2023-10-20', img: 'https://images4.alphacoders.com/666/666287.jpg' },
            { id: 104, title: 'Spy x Family', episodes: 12, clips: 25, status: 'Draft', date: '2023-10-15', img: 'https://images6.alphacoders.com/124/1243064.jpg' },
            { id: 105, title: 'Chainsaw Man', episodes: 0, clips: 0, status: 'Draft', date: '2023-10-10', img: 'https://images7.alphacoders.com/117/1179286.jpg' },
        ];

        const tbody = document.getElementById('admin-table-body');

        function renderTable(data) {
            tbody.innerHTML = '';
            data.forEach(anime => {
                // Status Badge styling
                const statusClass = anime.status === 'Published' 
                    ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
                    : 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';

                const encodedName = encodeURIComponent(anime.title);

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/50 transition-colors group">
                        <td class="px-6 py-4 text-xs font-mono opacity-50">#${anime.id}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-4">
                                <img src="${anime.img}" class="w-12 h-12 rounded object-cover aspect-square bg-slate-800">
                                <div>
                                    <div class="font-bold text-white text-base">${anime.title}</div>
                                    <div class="text-xs text-slate-500">TV Series</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm">
                            <div class="flex flex-col gap-1">
                                <span class="text-white">${anime.episodes} Eps</span>
                                <span class="text-slate-500 text-xs">${anime.clips} Clips</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="inline-block px-2 py-1 rounded border text-xs font-bold uppercase tracking-wider ${statusClass}">
                                ${anime.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-500 font-mono">${anime.date}</td>
                        <td class="px-6 py-4">
                            <div class="flex justify-end gap-2 opacity-70 group-hover:opacity-100 transition-opacity">
                                <a href="admin-edit.html?name=${encodedName}" class="p-2 bg-slate-800 hover:bg-blue-600 text-white rounded-lg transition-colors" title="Edit">
                                    <span class="material-symbols-rounded text-sm">edit</span>
                                </a>
                                <button class="p-2 bg-slate-800 hover:bg-red-600 text-white rounded-lg transition-colors" title="Delete" onclick="confirm('Delete ${anime.title}?')">
                                    <span class="material-symbols-rounded text-sm">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function handleAdminSearch() {
            const q = document.getElementById('admin-search').value.toLowerCase();
            const filtered = animeList.filter(item => item.title.toLowerCase().includes(q));
            renderTable(filtered);
        }

        window.onload = () => renderTable(animeList);
    </script>

</body>
</html>
