
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anime Clip Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1217;
      --panel: #141922;
      --accent: #2b6cf6;
      --accent-2: #56b0ff;
      --text: #f2f5f9;
      --muted: #9aa6b2;
      --border: #1f2630;
      --focus: #8ab6ff;
      --white: #ffffff;
      --success: #2bd17e;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box }
    html, body { height: 100% }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 85% -100%, #12203a 0%, var(--bg) 50%), var(--bg);
      color: var(--text);
    }
    a { color: var(--accent) ; text-decoration: none }
    img { display: block; max-width: 100% }
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(20, 25, 34, 0.7);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      color: var(--white);
      font-weight: 700;
    }
    .nav-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--text);
      background: #10151d;
      transition: 160ms ease;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { border-color: #2a3240 }
    .btn.primary {
      background: linear-gradient(180deg, #0d3abf, var(--accent));
      border-color: #1647d0;
      color: var(--white);
    }
    .btn.ghost {
      background: transparent;
      color: var(--text);
    }
    .container {
      width: 100%;
      max-width: 1120px;
      margin: 24px auto;
      padding: 0 24px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 24px;
      align-items: center;
    }
    .hero-card {
      background: linear-gradient(180deg, #101622 0%, #0e141d 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }
    .title { font-size: 28px; font-weight: 800 }
    .subtitle { color: var(--muted); margin-top: 8px; line-height: 1.6 }
    .search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-top: 16px;
    }
    .input {
      width: 100%;
      background: #0d1219;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
      transition: 140ms ease;
      font-size: 14px;
    }
    .input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(138, 182, 255, 0.15) }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .tag {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-weight: 600;
      background: #0f1520;
      cursor: pointer;
      transition: 160ms ease;
    }
    .tag:hover { border-color: #2a3240 }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    @media (max-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr) } .hero { grid-template-columns: 1fr } }
    @media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 460px) { .grid { grid-template-columns: 1fr } }
    .card {
      display: grid;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #0e141d;
      transition: 180ms ease;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-2px); border-color: #2a3240 }
    .card-thumb {
      aspect-ratio: 16/9;
      background: #0b1118;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover }
    .card-body { padding: 12px }
    .card-title { font-weight: 700 }
    .card-meta { color: var(--muted); font-size: 12px; margin-top: 4px }
    .section {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 24px;
      margin-bottom: 8px;
    }
    .section h3 { margin: 0; font-size: 18px }
    .breadcrumb {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0f1420;
      color: var(--text);
      font-weight: 600;
    }
    .list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 900px) { .list { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 620px) { .list { grid-template-columns: 1fr } }
    .episode {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0e141d;
      cursor: pointer;
      transition: 160ms ease;
    }
    .episode:hover { border-color: #2a3240 }
    .clips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 900px) { .clips-grid { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 620px) { .clips-grid { grid-template-columns: 1fr } }
    .clip {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0f1520;
      overflow: hidden;
    }
    .clip-media {
      aspect-ratio: 16/9;
      background: #0b1118;
      display: grid;
      place-items: center;
      position: relative;
    }
    .clip-media img { width: 100%; height: 100%; object-fit: cover }
    .clip-body { padding: 12px }
    .clip-title { font-weight: 700; margin-bottom: 4px }
    .clip-meta { color: var(--muted); font-size: 12px; margin-bottom: 12px }
    .clip-actions { display: flex; gap: 8px }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #0a1a2f;
      background: linear-gradient(180deg, #a8d3ff, #7bb8ff);
    }
    .footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      margin-top: 24px;
    }
    .empty {
      border: 1px dashed #2a3240;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: #0e141d;
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="nav">
      <div class="brand">
        <div class="brand-badge">AF</div>
        <div>Anime Clip Finder</div>
      </div>
      <div class="nav-actions">
        <button class="btn ghost" data-link="#/home">Home</button>
        <button class="btn ghost" data-link="#/library">Library</button>
        <button class="btn primary" data-link="#/about">About</button>
      </div>
    </nav>

    <main id="root"></main>

    <footer class="footer">
      Built for anime editors and AMV makers • Blue/white on dark theme • Add your own sources and exports
    </footer>
  </div>

  <template id="home">
    <div class="container">
      <div class="hero">
        <div class="hero-card">
          <div class="title">Find the exact anime clip you need</div>
          <div class="subtitle">Search, browse by series, select an episode, and download clean clips for editing. Trim noise, keep impact.</div>
          <div class="search">
            <input id="home-search" class="input" type="search" placeholder="Search anime (e.g., Demon Slayer, Jujutsu Kaisen, Bleach)"/>
            <button class="btn primary" id="home-search-btn">Search</button>
          </div>
          <div class="tags">
            <span class="tag" data-link="#/library?q=top">Top picks</span>
            <span class="tag" data-link="#/library?q=action">Action</span>
            <span class="tag" data-link="#/library?q=drama">Drama</span>
            <span class="tag" data-link="#/library?q=fantasy">Fantasy</span>
            <span class="tag" data-link="#/library?q=sci-fi">Sci‑Fi</span>
          </div>
          <div class="section">
            <h3>Trending anime</h3>
            <button class="btn ghost" data-link="#/library">View all</button>
          </div>
          <div class="grid" id="home-trending"></div>
        </div>
        <div class="hero-card">
          <div class="card-thumb" style="border-radius:12px; overflow:hidden;">
            <img src="https://images.unsplash.com/photo-1614854262233-3b2c63fcc2a8?q=80&w=1600&auto=format&fit=crop" alt="Anime aesthetic banner">
          </div>
          <div class="card-body">
            <div class="card-title">Clean sources, quick downloads</div>
            <div class="card-meta">Use curated episodes with time-coded moments. Export in your preferred format after download.</div>
            <div style="margin-top:12px; display:flex; gap:8px;">
              <span class="pill">1080p</span>
              <span class="pill">No subtitles</span>
              <span class="pill">Scene tags</span>
            </div>
          </div>
        </div>
      </div>

      <div class="section" style="margin-top:28px;">
        <h3>Editor's shortcuts</h3>
      </div>
      <div class="grid" id="home-shortcuts"></div>
    </div>
  </template>

  <template id="library">
    <div class="container">
      <div class="section">
        <h3>Anime library</h3>
        <div style="display:flex; gap:12px;">
          <input id="library-search" class="input" type="search" placeholder="Search title or tag"/>
          <button class="btn" id="library-clear">Clear</button>
        </div>
      </div>
      <div class="grid" id="library-grid"></div>
      <div id="library-empty" class="empty" style="display:none;">No results. Try another title or tag.</div>
    </div>
  </template>

  <template id="anime">
    <div class="container">
      <div class="breadcrumb">
        <a href="#/home">Home</a> › <a href="#/library">Library</a> › <span id="anime-name-crumb"></span>
      </div>
      <div class="section">
        <h3 id="anime-name"></h3>
        <span class="pill" id="anime-pill">Series</span>
      </div>
      <div class="grid" id="anime-meta"></div>
      <div class="section">
        <h3>Episodes</h3>
        <span class="pill">Select an episode to view all clips</span>
      </div>
      <div class="list" id="episode-list"></div>
    </div>
  </template>

  <template id="episode">
    <div class="container">
      <div class="breadcrumb">
        <a href="#/home">Home</a> › <a href="#/library">Library</a> ›
        <a id="crumb-anime"></a> › <span id="crumb-episode"></span>
      </div>
      <div class="section">
        <h3 id="episode-title"></h3>
        <span class="pill" id="episode-pill"></span>
      </div>
      <div class="clips-grid" id="clips-grid"></div>
      <div id="clips-empty" class="empty" style="display:none;">No clips yet. Add moments to this episode.</div>
    </div>
  </template>

  <template id="about">
    <div class="container">
      <div class="section">
        <h3>About</h3>
        <span class="pill">Made for editors and AMV makers</span>
      </div>
      <div class="hero-card">
        <div class="subtitle">
          Browse curated clips by anime and episode. Each clip lists timecodes, tags, and a clean preview. Download ready-to-edit files without watermarks or burned subtitles.
        </div>
        <div style="margin-top:16px; display:grid; gap:12px;">
          <div class="pill">Dark theme with blue/white accents</div>
          <div class="pill">Hash-based navigation</div>
          <div class="pill">Static templates in one HTML file</div>
        </div>
      </div>
    </div>
  </template>

  <script>
    const db = {
      anime: [
        {
          id: "jujutsu-kaisen",
          name: "Jujutsu Kaisen",
          cover: "https://images.unsplash.com/photo-1612036782181-125db5a0f9d3?q=80&w=1600&auto=format&fit=crop",
          tags: ["action", "supernatural", "dark"],
          episodes: [
            {
              id: "s01e05",
              title: "S01E05 — Curse Womb Must Die II",
              number: 5,
              clips: [
                {
                  id: "jk-105-black-flash",
                  title: "Itadori’s first Black Flash",
                  time: "00:12:08–00:12:42",
                  duration: "34s",
                  tags: ["impact", "fx", "punch"],
                  thumb: "https://images.unsplash.com/photo-1606112219348-204d7d8b94ee?q=80&w=1600&auto=format&fit=crop",
                  url: "https://example.com/jujutsu/s01e05/black-flash.mp4"
                },
                {
                  id: "jk-105-nobara-slam",
                  title: "Nobara nail slam",
                  time: "00:07:20–00:07:47",
                  duration: "27s",
                  tags: ["speed", "weapon", "fx"],
                  thumb: "https://images.unsplash.com/photo-1520031202253-7c87b78fa5ce?q=80&w=1600&auto=format&fit=crop",
                  url: "https://example.com/jujutsu/s01e05/nobara-nail.mp4"
                }
              ]
            },
            {
              id: "s01e07",
              title: "S01E07 — Assault",
              number: 7,
              clips: [
                {
                  id: "jk-107-gojo-domain",
                  title: "Gojo’s Unlimited Void",
                  time: "00:16:40–00:17:30",
                  duration: "50s",
                  tags: ["domain", "fx", "ethereal"],
                  thumb: "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=1600&auto=format&fit=crop",
                  url: "https://example.com/jujutsu/s01e07/unlimited-void.mp4"
                }
              ]
            }
          ]
        },
        {
          id: "demon-slayer",
          name: "Demon Slayer",
          cover: "https://images.unsplash.com/photo-1541939268-59f2f4aa1f86?q=80&w=1600&auto=format&fit=crop",
          tags: ["action", "fantasy", "style"],
          episodes: [
            {
              id: "s01e19",
              title: "S01E19 — Hinokami",
              number: 19,
              clips: [
                {
                  id: "ds-119-dance",
                  title: "Hinokami Kagura dance",
                  time: "00:20:40–00:21:18",
                  duration: "38s",
                  tags: ["fire", "sword", "impact"],
                  thumb: "https://images.unsplash.com/photo-1516166321266-3bd4f9e6cf6a?q=80&w=1600&auto=format&fit=crop",
                  url: "https://example.com/demon-slayer/s01e19/hinokami-kagura.mp4"
                }
              ]
            }
          ]
        },
        {
          id: "bleach",
          name: "Bleach",
          cover: "https://images.unsplash.com/photo-1520974735194-8d8f0c5b1d15?q=80&w=1600&auto=format&fit=crop",
          tags: ["action", "spiritual", "classic"],
          episodes: [
            {
              id: "s03e01",
              title: "S03E01 — The Reviving Lion",
              number: 46,
              clips: []
            }
          ]
        }
      ],
      shortcuts: [
        { label: "Impact hits", q: "impact", img: "https://images.unsplash.com/photo-1618240486167-63e3873b01ef?q=80&w=1600&auto=format&fit=crop" },
        { label: "FX sequences", q: "fx", img: "https://images.unsplash.com/photo-1542751110-97427bbecf20?q=80&w=1600&auto=format&fit=crop" },
        { label: "Sword arcs", q: "sword", img: "https://images.unsplash.com/photo-1606312619282-df3e1f4bd0b4?q=80&w=1600&auto=format&fit=crop" },
        { label: "Domain scenes", q: "domain", img: "https://images.unsplash.com/photo-1517816984748-6f418b3040f4?q=80&w=1600&auto=format&fit=crop" }
      ]
    };

    const mount = (tplId, data = {}) => {
      const root = document.getElementById("root");
      const tpl = document.getElementById(tplId);
      root.innerHTML = tpl ? tpl.innerHTML : "";
      if (tplId === "home") renderHome();
      if (tplId === "library") renderLibrary(data.q);
      if (tplId === "anime") renderAnime(data.id);
      if (tplId === "episode") renderEpisode(data.animeId, data.epId);
      if (tplId === "about") {}
      bindLinks();
    };

    const bindLinks = () => {
      document.querySelectorAll("[data-link]").forEach(el => {
        el.onclick = () => { location.hash = el.getAttribute("data-link"); };
      });
    };

    const renderCard = ({ id, name, cover, tags }) => {
      const div = document.createElement("div");
      div.className = "card";
      div.onclick = () => { location.hash = `#/anime/${id}`; };
      div.innerHTML = `
        <div class="card-thumb"><img src="${cover}" alt="${name} cover"></div>
        <div class="card-body">
          <div class="card-title">${name}</div>
          <div class="card-meta">${tags.join(" • ")}</div>
        </div>`;
      return div;
    };

    const renderHome = () => {
      const trending = document.getElementById("home-trending");
      db.anime.slice(0, 6).forEach(a => trending.appendChild(renderCard(a)));

      const shortcuts = document.getElementById("home-shortcuts");
      db.shortcuts.forEach(s => {
        const el = document.createElement("div");
        el.className = "card";
        el.onclick = () => { location.hash = `#/library?q=${encodeURIComponent(s.q)}`; };
        el.innerHTML = `
          <div class="card-thumb"><img src="${s.img}" alt="${s.label}"></div>
          <div class="card-body">
            <div class="card-title">${s.label}</div>
            <div class="card-meta">Filter: ${s.q}</div>
          </div>`;
        shortcuts.appendChild(el);
      });

      document.getElementById("home-search-btn").onclick = () => {
        const q = document.getElementById("home-search").value.trim();
        location.hash = `#/library${q ? `?q=${encodeURIComponent(q)}` : ""}`;
      };
    };

    const renderLibrary = (query = "") => {
      const grid = document.getElementById("library-grid");
      const empty = document.getElementById("library-empty");
      const input = document.getElementById("library-search");
      const clear = document.getElementById("library-clear");

      input.value = query || "";
      const q = (query || "").toLowerCase();
      const filtered = db.anime.filter(a => {
        const hay = `${a.name} ${a.tags.join(" ")}`.toLowerCase();
        return !q || hay.includes(q);
      });

      grid.innerHTML = "";
      filtered.forEach(a => grid.appendChild(renderCard(a)));
      empty.style.display = filtered.length ? "none" : "block";

      input.onkeydown = e => { if (e.key === "Enter") location.hash = `#/library?q=${encodeURIComponent(input.value.trim())}`; };
      clear.onclick = () => { location.hash = "#/library"; };
    };

    const renderAnime = (animeId) => {
      const anime = db.anime.find(a => a.id === animeId);
      if (!anime) { mount("library"); return; }

      document.getElementById("anime-name").textContent = anime.name;
      document.getElementById("anime-name-crumb").textContent = anime.name;
      document.getElementById("anime-pill").textContent = anime.tags.join(" • ");

      const meta = document.getElementById("anime-meta");
      meta.innerHTML = `
        <div class="card">
          <div class="card-thumb"><img src="${anime.cover}" alt="${anime.name} banner"></div>
          <div class="card-body">
            <div class="card-title">Series overview</div>
            <div class="card-meta">${anime.tags.join(" • ")}</div>
          </div>
        </div>`;

      const list = document.getElementById("episode-list");
      list.innerHTML = "";
      anime.episodes.forEach(ep => {
        const el = document.createElement("div");
        el.className = "episode";
        el.onclick = () => { location.hash = `#/anime/${anime.id}/episode/${ep.id}`; };
        el.innerHTML = `
          <div style="font-weight:700;">${ep.title}</div>
          <div style="display:flex; gap:8px; align-items:center;">
            <span class="pill">Episode ${ep.number}</span>
          </div>`;
        list.appendChild(el);
      });
    };

    const renderEpisode = (animeId, epId) => {
      const anime = db.anime.find(a => a.id === animeId);
      if (!anime) { mount("library"); return; }
      const ep = anime.episodes.find(e => e.id === epId);
      if (!ep) { mount("anime", { id: animeId }); return; }

      document.getElementById("crumb-anime").textContent = anime.name;
      document.getElementById("crumb-anime").setAttribute("href", `#/anime/${anime.id}`);
      document.getElementById("crumb-episode").textContent = ep.title;
      document.getElementById("episode-title").textContent = `${anime.name} — ${ep.title}`;
      document.getElementById("episode-pill").textContent = `Episode ${ep.number}`;

      const grid = document.getElementById("clips-grid");
      const empty = document.getElementById("clips-empty");
      grid.innerHTML = "";
      if (!ep.clips.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      ep.clips.forEach(clip => {
        const el = document.createElement("div");
        el.className = "clip";
        el.innerHTML = `
          <div class="clip-media">
            <img src="${clip.thumb}" alt="${clip.title}">
          </div>
          <div class="clip-body">
            <div class="clip-title">${clip.title}</div>
            <div class="clip-meta">Time: ${clip.time} • Duration: ${clip.duration}</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
              ${clip.tags.map(t => `<span class="badge">${t}</span>`).join("")}
            </div>
            <div class="clip-actions">
              <a class="btn primary" href="${clip.url}" download>Download</a>
              <button class="btn ghost" onclick="preview('${clip.url}')">Preview</button>
            </div>
          </div>`;
        grid.appendChild(el);
      });
    };

    const preview = (url) => {
      const w = window.open("", "_blank", "noopener,noreferrer");
      if (!w) return;
      w.document.write(`
        <html><head><title>Preview</title>
        <style>
          body { margin:0; background:#000; display:grid; place-items:center; height:100vh }
          video { width:90vw; height:auto; outline:none }
          .bar { position:fixed; top:0; left:0; right:0; padding:10px 14px; background:#0b0b0b; color:#fff; font-family:Inter,system-ui; }
        </style></head>
        <body>
          <div class="bar">Preview • Right-click to save if download fails</div>
          <video src="${url}" controls autoplay></video>
        </body></html>
      `);
      w.document.close();
    };

    const router = () => {
      const h = location.hash || "#/home";
      const [_, route, a1, route2, a2] = h.split("/");
      if (route === "home") return mount("home");
      if (route === "library") {
        const q = new URLSearchParams((h.split("?")[1] || "")).get("q") || "";
        return mount("library", { q });
      }
      if (route === "anime" && a1) {
        if (route2 === "episode" && a2) return mount("episode", { animeId: a1, epId: a2 });
        return mount("anime", { id: a1 });
      }
      if (route === "about") return mount("about");
      mount("home");
    };

    window.addEventListener("hashchange", router);
    window.addEventListener("DOMContentLoaded", router);
  </script>
</body>
</html>
